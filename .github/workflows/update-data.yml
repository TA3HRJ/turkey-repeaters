name: Update repeater data

on:
  workflow_dispatch:       # manual runs only

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild compact payload
        run: python scripts/build_compact.py

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet -- docs/data/; then
            echo "No data changes; skipping commit."
          else
            git commit -m "chore: rebuild compact data"
            git push
          fi
