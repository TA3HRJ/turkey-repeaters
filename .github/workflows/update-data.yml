name: Update repeater data

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape sources
        run: python scripts/scrape.py

      - name: Build compact payload
        run: python scripts/build_compact.py

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          # Ignore the "updated" date line; only commit real data changes.
          if git diff --cached --quiet -I '"updated"' -- docs/data/repeaters.json; then
            echo "No data changes; skipping commit."
          else
            git commit -m "chore: automated weekly repeater data refresh"
            git push
          fi
